<template id="entity-filter-template">
    <div :id="type + '-filter-form'" class="entity-filter-control">
        <label :for="'select-' + type + '-filter'"><span class="iconify inline mr-1" data-icon="mdi:filter"></span> ${type}</label>
        <select name="project" :id="'select-' + type + '-filter'" class="select-default" v-model="selection" @input="onSelectionUpdated">
            <option :value="null">Filter by ${type} ...</option>
            <option v-for="o in options" :value="o">{{ "{{" }}o{{ "}}" }}</option>
        </select>
    </div>
</template>

<template id="combobox-filter-template">
    <div :id="type + '-filter-form'" class="entity-filter-control combobox" :class="{ open: open }" @click.stop @keydown="onKeydown">
        <label :for="'input-' + type + '-filter'"><span class="iconify inline mr-1" data-icon="mdi:filter"></span> ${type}</label>
        <input type="text"
               :id="'input-' + type + '-filter'"
               class="combobox-input"
               :placeholder="placeholderText()"
               v-model="query"
               @input="onInput"
               @focus="onFocus"
               @click="onFocus"
               autocomplete="off">
        <ul v-show="open && (loading || visibleOptions.length || hint || (multiple ? selected.length : selection))" class="entity-filter-dropdown">
            <li v-if="loading" class="is-info">Searching …</li>
            <li v-if="multiple && !loading && visibleOptions.length"
                class="selall"
                :class="{ on: allVisibleSelected() }"
                @mousedown.prevent="selectAllVisible()"><span class="box"></span>{{ "{{" }}allVisibleSelected() ? 'Deselect all' : 'Select all'{{ "}}" }} ({{ "{{" }}visibleOptions.length{{ "}}" }})</li>
            <li v-for="o in visibleOptions"
                :key="o"
                :class="{ on: multiple && isSelected(o), sel: !multiple && o === selection }"
                @mousedown.prevent="multiple ? toggle(o) : select(o)"><span v-if="multiple" class="box"></span>{{ "{{" }}o{{ "}}" }}</li>
            <li v-if="!loading && hint && !visibleOptions.length" class="is-info">{{ "{{" }}hint{{ "}}" }}</li>
            <li v-if="!loading && (multiple ? selected.length : selection)"
                class="clear-item"
                @mousedown.prevent="multiple ? clearAll() : select(null)">{{ "{{" }}multiple ? 'Clear all (' + selected.length + ')' : 'Clear filter'{{ "}}" }}</li>
        </ul>
    </div>
</template>
